name: Repair staging TBA connection
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-staging-tba.yml'
      - 'staging/scripts/repair-tba-secret.mjs'
permissions:
  contents: read
concurrency:
  group: repair-staging-tba
  cancel-in-progress: false
jobs:
  repair:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[repair-staging-tba]'))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      summary: ${{ steps.repair.outputs.summary }}
      connection: ${{ steps.verify.outputs.summary }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Recover the misplaced staging key when accessible
        id: repair
        run: node staging/scripts/repair-tba-secret.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '59d4d2dd49ba336fb1240d43f1535207'
      - name: Verify the real data import
        id: verify
        if: steps.repair.outputs.connected == 'true'
        run: node staging/scripts/check-frc-connection.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '59d4d2dd49ba336fb1240d43f1535207'
  report:
    needs: repair
    if: always() && needs.repair.outputs.summary != ''
    name: ${{ needs.repair.outputs.connection || needs.repair.outputs.summary }}
    runs-on: ubuntu-latest
    steps:
      - run: echo 'See the staging TBA repair summary for the result.'
