name: Check and deploy
on:
  push:
    branches: [main]
    tags: ['production-*']
  pull_request:
  workflow_dispatch:
    inputs:
      deploy_production:
        description: Publish the checked main commit to the public league website
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: ftc-${{ github.workflow }}-${{ ((github.event_name == 'workflow_dispatch' && inputs.deploy_production == true) || startsWith(github.ref, 'refs/tags/production-')) && 'production' || github.ref }}
  cancel-in-progress: false
jobs:
  check-and-deploy:
    # Keep the native workerd test runtime on a stable runner image.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run format:check
      - run: npm run check
      - run: npm run build:staging
      - run: node --check staging/worker.mjs
      - run: node --check web/draft.js
      - name: Run tests
        run: node --test --test-reporter=spec --test-reporter-destination=stdout --test-reporter=./scripts/ci-test-reporter.mjs --test-reporter-destination=stdout
      - name: Require production tags to reference main history
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/production-')
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main
      - name: Initialize public regional leagues
        if: (github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.deploy_production == true) || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/production-'))
        run: npx wrangler d1 execute ftc-draft-coordination --remote --config wrangler.jsonc --file migrations/0005_regional_leagues.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '59d4d2dd49ba336fb1240d43f1535207'
      - name: Deploy production
        if: (github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.deploy_production == true) || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/production-'))
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '59d4d2dd49ba336fb1240d43f1535207'
      - name: Verify public deployment
        if: (github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.deploy_production == true) || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/production-'))
        run: node scripts/check-public-deployment.mjs
