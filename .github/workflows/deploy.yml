name: Check and deploy
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy_production:
        description: Publish the checked main commit to the public league website
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: ftc-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  check-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run format:check
      - run: npm run check
      - run: npm run build:staging
      - run: node --check staging/worker.mjs
      - run: node --check web/draft.js
      - run: node --test
      - name: Deploy production
        if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.deploy_production == true
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '59d4d2dd49ba336fb1240d43f1535207'
