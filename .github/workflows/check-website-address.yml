name: Check website address
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/check-website-address.yml'
      - 'scripts/check-website-address.mjs'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      summary: ${{ steps.address.outputs.summary }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build:staging
      - id: address
        run: node scripts/check-website-address.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '59d4d2dd49ba336fb1240d43f1535207'
          PROPOSED_SUBDOMAIN: firstfantasyleague
  report:
    needs: inspect
    name: ${{ needs.inspect.outputs.summary }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - run: echo 'Read-only address check completed; see the workflow summary.'
