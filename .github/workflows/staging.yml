name: Deploy private staging
on:
  push:
    branches: [staging]
  pull_request:
    branches: [main, staging]
permissions:
  contents: read
concurrency:
  group: ftc-private-staging-${{ github.ref }}
  cancel-in-progress: false
jobs:
  staging:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run format:check
      - run: npm run check
      - run: npm run build:staging
      - run: node --check staging/worker.mjs
      - run: node --check web/draft.js
      - run: node --test
      - name: Inspect token-management capability when requested
        if: github.event_name == 'push' && github.ref == 'refs/heads/staging' && contains(github.event.head_commit.message, '[check-cloudflare-access]')
        run: node staging/scripts/check-token-access.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '59d4d2dd49ba336fb1240d43f1535207'
      - name: Grant the two existing admins staging access when explicitly requested
        if: github.event_name == 'push' && github.ref == 'refs/heads/staging' && contains(github.event.head_commit.message, '[sync-staging-admins]')
        run: node staging/scripts/sync-admins.mjs --apply --expected-count=2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '59d4d2dd49ba336fb1240d43f1535207'
      - name: Initialize isolated staging league tables
        if: github.ref == 'refs/heads/staging' && github.event_name == 'push'
        run: npx wrangler d1 execute ftc-draft-staging --remote --config staging/wrangler.jsonc --file staging/migrations/0001_leagues.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '59d4d2dd49ba336fb1240d43f1535207'
      - name: Deploy staging only
        if: github.ref == 'refs/heads/staging' && github.event_name == 'push'
        run: npx wrangler deploy --config staging/wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '59d4d2dd49ba336fb1240d43f1535207'
      - name: Verify private staging deployment
        if: github.ref == 'refs/heads/staging' && github.event_name == 'push'
        run: node staging/scripts/check-deployment.mjs
