name: Deploy private staging
on:
  push:
    branches: [staging]
  pull_request:
    branches: [main, staging]
permissions:
  contents: read
concurrency:
  group: ftc-private-staging-${{ github.ref }}
  cancel-in-progress: false
jobs:
  staging:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: node build-staging.mjs
      - run: node --check staging-worker.mjs
      - run: node --test staging.test.mjs
      - name: Deploy staging only
        if: github.ref == 'refs/heads/staging' && github.event_name == 'push'
        run: npx wrangler deploy --config wrangler.staging.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '59d4d2dd49ba336fb1240d43f1535207'
